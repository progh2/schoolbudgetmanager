name: Deploy to GitHub Pages

# 설계 근거: docs/ARCHITECTURE.md §7
# 최초 1회: Settings → Pages → Source를 "GitHub Actions"로.
# PR에서는 테스트·빌드·스모크까지만, main 푸시에서만 배포한다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 실제 브라우저로 하위 경로·루트 둘 다 눌러 본다 (Pages·Pod 흉내)
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screens
          path: test-results/smoke
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
